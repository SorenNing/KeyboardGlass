name: Keyboard Glass original joined background
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build original material with joined candidate background
        shell: bash
        run: |
          set -o pipefail
          python3 tools/build_join.py 2>&1 | tee compile.log
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-log
          path: compile.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-glass-original-joined
          path: dist/
          if-no-files-found: error
