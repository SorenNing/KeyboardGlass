name: Keyboard Glass 64e
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify native RootHide package
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-glass-64e
          path: |
            dist/*.deb
            dist/verification.json
          if-no-files-found: error
