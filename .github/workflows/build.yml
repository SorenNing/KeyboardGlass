name: Keyboard Glass iOS16 rootless and RootHide
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check material geometry and settings
        run: python3 tools/check_source.py
      - name: Check contour alignment and edge continuity
        run: python3 tools/test_glass_edges.py
      - name: Check Settings controller cache and reload
        run: python3 tools/test_settings_cache.py
      - name: Check candidate controls hide and restore
        run: python3 tools/test_candidate_controls.py
      - name: Check candidate highlight backgrounds
        run: python3 tools/test_candidate_highlight.py
      - name: Check global preference producer and consumer
        run: python3 tools/test_global_preferences.py
      - name: Check material blur and iOS 16 package policy
        run: python3 tools/test_material_blur.py
      - name: Build and verify rootless and RootHide packages
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-glass-0.2.6-arm64
          path: |
            dist/*.deb
            dist/verification.json
          if-no-files-found: error
