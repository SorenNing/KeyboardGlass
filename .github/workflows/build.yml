name: Keyboard Glass dynamic 64e
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Metal toolchain
        run: |
          if ! xcrun --sdk iphoneos metal -v; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Build and verify native RootHide package
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-glass-dynamic-64e
          path: |
            dist/*.deb
            dist/verification.json
          if-no-files-found: error
