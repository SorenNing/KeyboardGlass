name: Keyboard Glass Theseus 64e
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile Theseus keyboard material
        shell: bash
        run: |
          set -o pipefail
          python3 tools/ci_compile.py 2>&1 | tee compile.log
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-log
          path: compile.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-glass-theseus-64e
          path: dist/
          if-no-files-found: error
