name: Keyboard Glass 64e
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Ensure Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun --find metal >/dev/null 2>&1; then xcodebuild -downloadComponent MetalToolchain; fi
      - name: Build and verify native RootHide package
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-glass-64e
          path: |
            dist/*.deb
            dist/verification.json
          if-no-files-found: error
